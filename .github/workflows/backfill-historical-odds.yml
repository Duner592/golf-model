name: Backfill historical odds

on:
  schedule:
    # Small, deliberately slow batches until the archive is complete.
    - cron: "17 */2 * * *"
  workflow_dispatch:
    inputs:
      max_events:
        description: "Missing archive events to fetch in this batch"
        required: true
        default: "5"
        type: string

permissions:
  contents: write

jobs:
  backfill:
    runs-on: ubuntu-latest
    env:
      DATAGOLF_API_KEY: ${{ secrets.DATAGOLF_API_KEY }}
      MAX_EVENTS: ${{ inputs.max_events || '5' }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.10"
      - run: python -m pip install -e .
      - run: python scripts/fetch_archive_outright_odds.py --delay-seconds 12 --max-events "$MAX_EVENTS"
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/archive/historical_odds.json
          git diff --cached --quiet && exit 0
          git commit -m "Backfill historical odds"
          git pull --rebase origin master
          git push
