<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>2026 Golf Tour Schedules</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="menu.css">
    <script src="menu.js?v=20260814-schedule-nav2"></script>
    <!-- Added theme.css for shared styles -->
    <link rel="stylesheet" href="theme.css">
    <style>
        html { -webkit-text-size-adjust: 100%; }
        body {
            font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
            margin: 2rem;
            color: #111;
            transition: padding-left 0.3s;
            display: flex;
            flex-direction: column;
        }

        /* Logo (same as index) */
        .logo {
            position: absolute;
            top: 8px;
            right: 16px;
            height: 80px;
            width: auto;
            z-index: 1002;
        }

        /* Tour filter dropdown (always visible) */
        .schedule-filters {display:flex;flex-wrap:wrap;gap:1.25rem;padding:1.1rem 1.25rem;border:1px solid #d5e3da;border-radius:12px;background:#f0f7f2;align-self:flex-start;box-sizing:border-box;max-width:100%}
        .schedule-filter {display:flex;flex-direction:column;gap:.45rem;min-width:160px;flex:1}
        .schedule-filter label {font-size:.85rem;font-weight:650;color:#355942}
        .schedule-filter select {font:inherit;font-weight:600;color:#173d28;background:#fff;border:1px solid #a3b9ab;border-radius:8px;padding:.7rem 2rem .7rem .85rem;min-height:44px;cursor:pointer;width:100%}
        .schedule-filter select:hover {border-color:#357852}
        .schedule-filter select:focus-visible {outline:3px solid #357852;outline-offset:3px}
        #season-note {color:#52665a;line-height:1.5;font-size:.9rem}
        @media(max-width:480px){.schedule-filters{align-self:stretch;gap:.8rem}.schedule-filter{min-width:120px}}

        /* Table area */
        .table-container { overflow-x: auto; width: 100%; -webkit-overflow-scrolling: touch; }
        table { border-collapse: collapse; width: auto; }
        th, td { border: 1px solid #ddd; padding: 8px; text-align: left; white-space: nowrap; }
        th { background-color: #f2f2f2; }

        /* Date group border */
        .date-group { border-top: 2px solid #000; }

        /* Rolex Series highlight (Euro) */
        .rolex-series { background-color: yellow; }

        /* Majors highlight (PGA) */
        .majors { background-color: lightgreen; }

        /* Signature Events highlight (PGA) */
        .signature-events { background-color: lightblue; }

        /* FedEx Playoffs highlight (PGA) */
        .fedex-playoffs { background-color: #d8bfd8; }  /* Light purple */

        .schedule-link { color: #145f35; font-weight: 650; text-decoration: none; }
        .schedule-link:hover, .schedule-link:focus-visible { text-decoration: underline; text-underline-offset: 0.16em; }

        /* Key for events */
        .event-key {display:flex;flex-wrap:wrap;gap:.6rem;margin:1rem 0;font-size:.9rem;color:#333}
        .event-key span {display:inline-block;border-radius:5px}
        .event-key p { margin: 0.25rem 0; }

        /* Link button (same as index) */
        .link { display: inline-block; margin: 0.25rem 0; padding: 0.25rem 0.5rem; background: linear-gradient(135deg, var(--gm-primary-light), var(--gm-primary)); color: white; text-decoration: none; border-radius: 6px; font-size: 0.9rem; box-shadow: 0 8px 18px -14px rgba(29,124,66,0.55); transition: background 0.2s ease, transform 0.2s ease; }
        .link:hover { background: linear-gradient(135deg, var(--gm-primary), var(--gm-primary-dark)); transform: translateY(-1px); }

        @media (max-width: 768px) {
            body { padding-top: 70px; }
            .logo { height: 60px; top: 5px; right: 5px; }

            /* Column min-widths + wrap for Event and Course so they're not tiny, but can wrap */
            th:nth-child(1), td:nth-child(1) { min-width: 100px; }   /* Date */
            th:nth-child(2), td:nth-child(2) { min-width: 120px; }   /* Tour */
            th:nth-child(3), td:nth-child(3) {                       /* Event */
                min-width: 210px;
                white-space: normal;
                overflow-wrap: anywhere;
                word-break: break-word;
                line-height: 1.3;
            }
            th:nth-child(4), td:nth-child(4) {                       /* Course */
                min-width: 170px;
                white-space: normal;
                overflow-wrap: anywhere;
                word-break: break-word;
                line-height: 1.3;
            }
            th:nth-child(5), td:nth-child(5) { min-width: 220px; }   /* Location */
            th:nth-child(6), td:nth-child(6) { min-width: 150px; }   /* Winner */
        }
    </style>
</head>
<body>
<div class="logo-wrapper">
    <img src="EdsGolfModelLogo.svg" alt="Eds Golf Model Logo" class="logo">
</div>
<div class="overlay" id="overlay" onclick="toggleMenu()"></div>

<!-- Same placement as index.html -->
<div class="menu-container"></div>

<h1 id="schedule-title">2026 Golf Tour Schedules</h1>
<div class="schedule-filters" role="group" aria-label="Schedule filters">
<div class="schedule-filter">
<label for="season-select">Season</label>
<select id="season-select"><option value="2026">2026</option><option value="2027">2027</option></select>
</div>

<!-- Tour filter dropdown (always visible) -->
<div id="tour-filter" class="schedule-filter">
    <label for="tour-select">Tour</label>
    <select id="tour-select">
        <option value="all">All Tours</option>
        <option value="Major">Major</option>
        <option value="DP World Tour">DP World Tour</option>
        <option value="PGA Tour">PGA Tour</option>
    </select>
</div>
</div>
<p id="season-note" role="status"></p>

<!-- Key for events -->
<div class="event-key">
    <p><span style="background-color: yellow; padding: 2px 4px;">Rolex Series events</span></p>
    <p><span style="background-color: lightgreen; padding: 2px 4px;">Majors</span></p>
    <p><span style="background-color: lightblue; padding: 2px 4px;">Signature events</span></p>
    <p><span style="background-color: #d8bfd8; padding: 2px 4px;">FedEx Playoff events</span></p>
</div>

<div class="table-container">
    <table id="schedule-table">
        <thead>
        <tr>
            <th>Date</th>
            <th>Tour</th>
            <th>Event</th>
            <th>Course</th>
            <th>Location</th>
            <th>Winner</th>
        </tr>
        </thead>
        <tbody></tbody>
    </table>
</div>

<div class="menu" id="menu"></div>

<script>
    // Data variables
    let allData = [];
    let currentFilter = 'all';
    const majorEvents = new Set([
        'Masters Tournament',
        'PGA Championship',
        'U.S. Open',
        'The Open Championship'
    ]);

    function escapeHtml(value) {
        return String(value ?? '').replace(/[&<>'"]/g, char => ({
            '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;'
        })[char]);
    }

    function isUsableValue(value) {
        return value && !['n/a', 'tbd', 'unknown', '-'].includes(String(value).trim().toLowerCase());
    }

    function courseLink(course) {
        if (!isUsableValue(course)) return escapeHtml(course || 'N/A');
        return `<a class="schedule-link" href="course_details.html?course=${encodeURIComponent(course)}">${escapeHtml(course)}</a>`;
    }

    function winnerLink(winner, sourceTour) {
        if (!isUsableValue(winner)) return escapeHtml(winner || 'N/A');
        const params = new URLSearchParams({ tour: sourceTour || 'pga', player: winner });
        return `<a class="schedule-link" href="player.html?${params.toString()}">${escapeHtml(winner)}</a>`;
    }

    function locationLink(location) {
        if (!isUsableValue(location)) return escapeHtml(location || 'N/A');
        const mapsUrl = `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(location)}`;
        return `<a class="schedule-link" href="${mapsUrl}" target="_blank" rel="noopener noreferrer">${escapeHtml(location)}</a>`;
    }

    // Tour select change event
    const tourSelect = document.getElementById('tour-select');
    tourSelect.addEventListener('change', () => {
        currentFilter = tourSelect.value;
        renderTable();
    });

    // Data load
    const tbody = document.querySelector('#schedule-table tbody');
    tbody.innerHTML = '<tr><td colspan="6" style="text-align: center;">Loading schedule...</td></tr>';

    let loadRequest = 0;
    async function loadSeason() {
      const request = ++loadRequest;
      const season = document.getElementById('season-select').value;
      document.getElementById('schedule-title').textContent = `${season} Golf Tour Schedules`;
      document.getElementById('season-note').textContent = season === '2027' ? 'Provisional DataGolf season schedule: dates, names, venues and event IDs may change. The DP World Tour season starts in late 2026. Colours use the site’s existing event-name categories and are provisional, not confirmation of 2027 designations.' : '';
      allData = [];
      tbody.innerHTML = '<tr><td colspan="6">Loading schedule…</td></tr>';
      try {
      if (season === '2027') {
        const response = await fetch('schedules/2027.json', {cache:'no-cache'});
        if (!response.ok) throw new Error('Schedule unavailable');
        const payload = await response.json();
        if (payload.season !== 2027 || !Array.isArray(payload.schedule)) throw new Error('Invalid season');
        if (request !== loadRequest) return;
        allData = payload.schedule.map(e => ({...e, sourceTour:e.tour, event:e.event_name, date:/^\d{4}-\d{2}-\d{2}$/.test(e.start_date) ? e.start_date.split('-').reverse().join('-') : 'TBD', tour:e.tour === 'euro' ? 'DP World Tour' : majorEvents.has(e.event_name) ? 'Major' : 'PGA Tour'}));
      } else {
      const [euro,pga] = await Promise.all([
        fetch('euro/schedule.json').then(response => response.ok ? response.json() : []).catch(() => []),
        fetch('pga/schedule.json').then(response => response.ok ? response.json() : []).catch(() => [])
      ]);
        if (request !== loadRequest) return;
        euro.forEach(event => { event.sourceTour = 'euro'; event.tour = 'DP World Tour'; allData.push(event); });
        pga.forEach(event => {
            event.sourceTour = 'pga';
            event.tour = majorEvents.has(event.event) ? 'Major' : 'PGA Tour';
            allData.push(event);
        });
      }
        // Sort all data by date
        allData.sort((a, b) => new Date(a.date.split('-').reverse().join('-')) - new Date(b.date.split('-').reverse().join('-')));
        renderTable();
      } catch {
        if (request !== loadRequest) return;
        tbody.innerHTML = '<tr><td colspan="6" style="text-align: center; color: red;">Error loading schedule data. Please try again later.</td></tr>';
      }
    }
    document.getElementById('season-select').addEventListener('change', loadSeason);
    loadSeason();

    // Render table function
    function renderTable() {
        let data = allData;
        if (currentFilter !== 'all') {
            data = allData.filter(event => event.tour === currentFilter);
        }

        tbody.innerHTML = '';
        if (!data || !data.length) {
            tbody.innerHTML = '<tr><td colspan="6" style="text-align: center;">No events found.</td></tr>';
            return;
        }

        const rolexEvents = [
            'Hero Dubai Desert Classic',
            'BMW PGA Championship',
            'Abu Dhabi Championship',
            'DP World Tour Championship'
        ];
        const signatureEvents = [
            'AT&T Pebble Beach Pro-Am',
            'The Genesis Invitational',
            'Arnold Palmer Invitational presented by Mastercard',
            'RBC Heritage',
            'Miami Championship',
            'Truist Championship',
            'the Memorial Tournament presented by Workday',
            'Travelers Championship'
        ];
        const fedexEvents = [
            'FedEx St. Jude Championship',
            'BMW Championship',
            'TOUR Championship'
        ];

        let prevDate = null;
        data.forEach(event => {
            const row = document.createElement('tr');
            if (event.date !== prevDate) {
                row.classList.add('date-group');
            }
            prevDate = event.date;

            if (majorEvents.has(event.event)) {
                row.classList.add('majors');
            } else if (event.tour === 'DP World Tour') {
                const isRolex = rolexEvents.includes(event.event);
                if (isRolex) row.classList.add('rolex-series');
            } else if (event.tour === 'PGA Tour') {
                const isSignature = signatureEvents.includes(event.event);
                const isFedex = fedexEvents.includes(event.event);
                if (isSignature) row.classList.add('signature-events');
                if (isFedex) row.classList.add('fedex-playoffs');
            }
            row.innerHTML = `<td>${escapeHtml(event.date || 'N/A')}</td><td>${escapeHtml(event.tour)}</td><td>${escapeHtml(event.event || 'N/A')}</td><td>${courseLink(event.course)}</td><td>${locationLink(event.location)}</td><td>${winnerLink(event.winner, event.sourceTour)}</td>`;
            tbody.appendChild(row);
        });
    }

    // Load menu HTML
    fetch('menu.html?v=20260417').then(response => response.text()).then(html => document.getElementById('menu').innerHTML = html);
</script>
</body>
</html>
