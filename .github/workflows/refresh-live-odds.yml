name: Refresh live odds

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-live-odds
  cancel-in-progress: false

jobs:
  refresh-live-odds:
    runs-on: ubuntu-latest
    env:
      DATAGOLF_API_KEY: ${{ secrets.DATAGOLF_API_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.10"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .

      - name: Fetch Bet365 and Sky Bet outright odds
        run: python scripts/fetch_live_outright_odds.py --tour both

      - name: Commit updated odds board
        run: |
          if git diff --quiet -- web/odds/current.json; then
            echo "No live odds changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/odds/current.json
          git commit -m "Refresh live odds [skip ci]"
          git pull --rebase origin master
          git push
